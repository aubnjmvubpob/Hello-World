name: scrape-yt
on:
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps
      - name: Load all playlist videos
        run: |
          cat > scrape.mjs <<'EOF'
          import { chromium } from 'playwright';
          const playlist='PLyzTA8cetPdHtlGw1X8Kt7Ea4bd27ApR7';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1400,height:1000},userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'});
          await page.goto('https://www.youtube.com/playlist?list='+playlist+'&hl=en&gl=US&bpctr=9999999999&has_verified=1',{waitUntil:'networkidle',timeout:90000});
          await page.waitForTimeout(3000);
          for (const label of ['Accept all','I agree','Accept','Reject all','Dismiss']) {
            const btn=page.locator(`button:has-text("${label}"), tp-yt-paper-button:has-text("${label}")`).first();
            if (await btn.count()) { try { await btn.click({timeout:2000}); await page.waitForTimeout(1000); } catch {} }
          }
          const snapshot = async (label) => {
            const rows=await page.locator('ytd-playlist-video-renderer').count();
            const links=await page.locator('a[href*="/watch?v="]').count();
            const buttons=await page.evaluate(()=>[...document.querySelectorAll('button, ytd-button-renderer, yt-button-shape, tp-yt-paper-button')].map(e=>({tag:e.tagName,id:e.id,text:(e.innerText||e.textContent||'').trim()})).filter(x=>/show|more|load/i.test(x.text)));
            console.log(label, 'ROWS', rows, 'LINKS', links, 'BUTTONS', JSON.stringify(buttons));
          };
          await snapshot('initial');
          for(let i=0;i<25;i++){
            await page.evaluate(()=>window.scrollTo(0,document.documentElement.scrollHeight));
            await page.locator('ytd-continuation-item-renderer').last().scrollIntoViewIfNeeded().catch(()=>{});
            await page.waitForTimeout(1000);
            await page.locator('ytd-continuation-item-renderer').last().click({timeout:3000}).catch(()=>{});
            const showMore=page.locator('button:has-text("Show more"), ytd-button-renderer:has-text("Show more"), yt-button-shape:has-text("Show more"), tp-yt-paper-button:has-text("Show more")').first();
            if(await showMore.count()) await showMore.click({timeout:3000}).catch(()=>{});
            await page.keyboard.press('PageDown').catch(()=>{});
            await page.waitForTimeout(2500);
            await snapshot('loop '+i);
            const rows=await page.locator('ytd-playlist-video-renderer').count();
            if(rows>=52) break;
          }
          const items=await page.evaluate(()=>{
            const rows=[...document.querySelectorAll('ytd-playlist-video-renderer')];
            return rows.map(row=>{
              const a=row.querySelector('a#video-title, #video-title a, a[href*="/watch?v="]');
              const title=(a?.getAttribute('title')||a?.innerText||a?.textContent||'').trim();
              const href=a?.href||'';
              const id=new URL(href,location.href).searchParams.get('v');
              return {title,id,href};
            }).filter(x=>x.title&&x.id);
          });
          console.log('FINAL_ITEMS',JSON.stringify(items,null,2));
          await page.screenshot({path:'final.png',fullPage:true});
          await browser.close();
          EOF
          node scrape.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-screenshot
          path: final.png
          if-no-files-found: warn
