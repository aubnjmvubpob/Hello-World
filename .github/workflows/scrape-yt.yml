name: scrape-yt
on:
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps
      - name: Debug and load playlist
        run: |
          cat > scrape.mjs <<'EOF'
          import { chromium } from 'playwright';
          const playlist='PLyzTA8cetPdHtlGw1X8Kt7Ea4bd27ApR7';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1400,height:1000},userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'});
          page.on('console', m => console.log('BROWSER', m.type(), m.text()));
          page.on('pageerror', e => console.log('PAGEERROR', e.message));
          await page.goto('https://www.youtube.com/playlist?list='+playlist+'&hl=en&gl=US&bpctr=9999999999&has_verified=1',{waitUntil:'networkidle',timeout:90000});
          await page.waitForTimeout(5000);
          for (const label of ['Accept all','I agree','Accept','Reject all','Dismiss']) {
            const btn=page.locator(`button:has-text("${label}"), tp-yt-paper-button:has-text("${label}")`).first();
            if (await btn.count()) { try { await btn.click({timeout:3000}); await page.waitForTimeout(2000); } catch {} }
          }
          console.log('URL',page.url());
          console.log('TITLE',await page.title());
          console.log('BODY',await page.locator('body').innerText({timeout:5000}).catch(e=>String(e)));
          await page.screenshot({path:'shot-initial.png',fullPage:true});
          let last=-1;
          for(let i=0;i<40;i++){
            await page.keyboard.press('PageDown').catch(()=>{});
            await page.mouse.wheel(0,10000);
            await page.waitForTimeout(2000);
            const count=await page.locator('a[href*="/watch?v="]').count();
            console.log('SCROLL',i,'WATCH LINKS',count);
            if(count===last && i>8) break;
            last=count;
          }
          await page.screenshot({path:'shot-final.png',fullPage:true});
          const items=await page.evaluate(()=>{
            const anchors=[...document.querySelectorAll('a[href*="/watch?v="]')];
            return anchors.map(a=>({title:(a.getAttribute('title')||a.innerText||a.textContent||'').trim(),href:a.href})).filter(x=>x.title&&x.href.includes('/watch'));
          });
          const seen=new Set(); const unique=items.filter(x=>{if(seen.has(x.href))return false;seen.add(x.href);return true;});
          console.log('ITEMS',JSON.stringify(unique,null,2));
          await browser.close();
          EOF
          node scrape.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            shot-initial.png
            shot-final.png
