name: scrape-yt
on:
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps
      - name: Load playlist in headless Chrome
        run: |
          cat > scrape.mjs <<'EOF'
          import { chromium } from 'playwright';
          const playlist = 'PLyzTA8cetPdHtlGw1X8Kt7Ea4bd27ApR7';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1400, height: 1000 }, userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' });
          const browseResponses = [];
          page.on('response', async (response) => {
            const url = response.url();
            if (url.includes('/youtubei/v1/browse')) {
              try { browseResponses.push(await response.json()); } catch {}
            }
          });
          await page.goto('https://www.youtube.com/playlist?list=' + playlist + '&hl=en&gl=US', { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(5000);
          let lastCount = 0;
          for (let i = 0; i < 30; i++) {
            await page.mouse.wheel(0, 8000);
            await page.waitForTimeout(2000);
            const count = await page.locator('ytd-playlist-video-renderer, ytd-playlist-video-list-renderer, #video-title, a#video-title').count();
            console.log('scroll', i, 'elements', count);
            if (count === lastCount && i > 5) break;
            lastCount = count;
          }
          const domItems = await page.evaluate(() => {
            const anchors = [...document.querySelectorAll('a#video-title, ytd-playlist-video-renderer a[href*="watch"], ytd-playlist-video-list-renderer a[href*="watch"]')];
            return anchors.map(a => ({ title: (a.getAttribute('title') || a.innerText || a.textContent || '').trim(), href: a.href })).filter(x => x.title && x.href.includes('/watch'));
          });
          const seen = new Set();
          const uniqueDom = domItems.filter(x => { if (seen.has(x.href)) return false; seen.add(x.href); return true; });
          const apiItems = [];
          const walk = (x) => {
            if (!x || typeof x !== 'object') return;
            if (Array.isArray(x)) { x.forEach(walk); return; }
            if (x.lockupViewModel) {
              const l = x.lockupViewModel;
              const title = l.metadata?.lockupMetadataViewModel?.title?.content;
              const id = l.contentId || l.videoId;
              if (title && id) apiItems.push({ title, id, href: 'https://www.youtube.com/watch?v=' + id });
            }
            if (x.playlistVideoRenderer) {
              const p = x.playlistVideoRenderer;
              const title = p.title?.runs?.[0]?.text || p.title?.simpleText;
              if (title && p.videoId) apiItems.push({ title, id: p.videoId, href: 'https://www.youtube.com/watch?v=' + p.videoId });
            }
            Object.values(x).forEach(walk);
          };
          browseResponses.forEach(walk);
          const allSeen = new Set();
          const all = [...apiItems, ...uniqueDom].filter(x => { const key=x.id||x.href; if (allSeen.has(key)) return false; allSeen.add(key); return true; });
          console.log('BROWSE RESPONSES', browseResponses.length);
          console.log('API ITEMS', apiItems.length);
          console.log('DOM ITEMS', uniqueDom.length);
          console.log('ALL ITEMS', JSON.stringify(all, null, 2));
          await browser.close();
          EOF
          node scrape.mjs
