name: scrape-yt
on:
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize tokens and call continuation
        run: |
          cat > scrape_normalized.py <<'PY'
          import json, re, urllib.request, urllib.error, urllib.parse
          playlist="PLyzTA8cetPdHtlGw1X8Kt7Ea4bd27ApR7"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Accept-Language":"en-GB,en;q=0.9"})
              with urllib.request.urlopen(req,timeout=30) as r: return r.read().decode("utf-8","replace")
          def norm(s): return s.replace("\\x22",'"').replace("\\x7b","{").replace("\\x7d","}").replace("\\x5b","[").replace("\\x5d","]").replace("\\x3d","=")
          def find(pat,s):
              m=re.search(pat,s); return m.group(1) if m else None
          def post(base,key,cid,client,ver,token,browse_id=None,visitor=None,click=None):
              c={"hl":"en-GB","gl":"SG","clientName":client,"clientVersion":ver,"userAgent":UA}
              if visitor: c["visitorData"]=visitor
              ctx={"client":c}
              if click: ctx["clickTracking"]={"clickTrackingParams":click}
              body={"context":ctx}
              if browse_id: body["browseId"]=browse_id
              body["continuation"]=token
              headers={"Content-Type":"application/json","User-Agent":UA,"Accept-Language":"en-GB,en;q=0.9","Origin":base,"Referer":base+"/playlist?list="+playlist,"X-YouTube-Client-Name":str(cid),"X-YouTube-Client-Version":ver}
              req=urllib.request.Request(base+"/youtubei/v1/browse?key="+key,data=json.dumps(body).encode(),headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: return r.status,r.read().decode()
              except urllib.error.HTTPError as e: return e.code,e.read().decode()
          def collect(x,out):
              if isinstance(x,dict):
                  if "lockupViewModel" in x:
                      l=x["lockupViewModel"]; md=l.get("metadata",{}).get("lockupMetadataViewModel",{})
                      out.append(("lockup",md.get("title",{}).get("content"),l.get("contentId") or l.get("videoId")))
                  if "playlistVideoRenderer" in x:
                      p=x["playlistVideoRenderer"]; out.append(("playlistVideo",p.get("title",{}).get("runs",[{}])[0].get("text"),p.get("videoId")))
                  if "musicResponsiveListItemRenderer" in x:
                      p=x["musicResponsiveListItemRenderer"]; title=None
                      for col in p.get("flexColumns",[]):
                          runs=col.get("musicResponsiveListItemFlexColumnRenderer",{}).get("text",{}).get("runs",[])
                          if runs: title=runs[0].get("text"); break
                      out.append(("music",title,p.get("playlistItemData",{}).get("videoId")))
                  for v in x.values(): collect(v,out)
              elif isinstance(x,list):
                  for v in x: collect(v,out)
          web_raw=get("https://www.youtube.com/playlist?list="+playlist)
          music_raw=get("https://music.youtube.com/playlist?list="+playlist)
          web=norm(web_raw); music=norm(music_raw)
          web_tokens=re.findall(r'(?:continuationCommand|nextContinuationData|reloadContinuationData)":\{"(?:token|continuation)":"([^"]+)"',web)
          music_tokens=re.findall(r'(?:continuationCommand|nextContinuationData|reloadContinuationData)":\{"(?:token|continuation)":"([^"]+)"',music)
          print("web tokens",web_tokens)
          print("music tokens",music_tokens)
          for label,raw_tokens,html,base,key,cid,client,ver_pat in [
              ("web",web_tokens,web,"https://www.youtube.com",None,1,"WEB",r'"INNERTUBE_CLIENT_VERSION":"([^"]+)"'),
              ("music",music_tokens,music,"https://music.youtube.com",None,67,"WEB_REMIX",r'"INNERTUBE_CLIENT_VERSION":"([^"]+)"'),
          ]:
              key=find(r'"INNERTUBE_API_KEY":"([^"]+)"',html)
              ver=find(ver_pat,html)
              visitor=find(r'"visitorData":"([^"]+)"',html)
              click=find(r'"clickTrackingParams":"([^"]+)"',html)
              print("\nCLIENT",label,key,ver,visitor,click)
              for raw_token in raw_tokens:
                  for token_label,token in [("raw",raw_token),("decoded",urllib.parse.unquote(raw_token))]:
                      for body_label,bid in [("cont",None),("browse","VL"+playlist)]:
                          name=f"{label} {token_label} {body_label}"
                          print("\n====",name,"====")
                          print("token",token)
                          status,raw=post(base,key,cid,client,ver,token,bid,visitor,click)
                          print("STATUS",status,"LEN",len(raw))
                          print(raw[:1000])
                          try: data=json.loads(raw)
                          except Exception: continue
                          out=[]; collect(data,out)
                          print("ITEMS",json.dumps(out,ensure_ascii=False))
                          print("KEYS",list(data.keys()))
                          if out: open("yt-continuation.json","w").write(json.dumps(data,ensure_ascii=False,indent=2))
          PY
          python3 scrape_normalized.py
