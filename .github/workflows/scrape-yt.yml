name: scrape-yt
on:
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch YouTube continuations
        run: |
          cat > scrape.py <<'PY'
          import json, urllib.request, urllib.error
          web_key = "AIzaSyAO_FJ2SlqU8Q4STEHLGCilw_Y9_11qcW8"
          music_key = "AIzaSyC9XL3ZjWddXya6X74dJoCTL-WEYFDNX30"
          web_token = "4qmFsgJbEiRWTFBMeXpUQThjZXRQZEh0bEd3MVg4S3Q3RWE0YmQyN0FwUjcaDGtnRURDTGNMNEFzQpoCJFZMUEx5elRBOGNldFBkSHRsR3cxWDhLdDdFYTRiZDI3QXBSNw=="
          music_token = "4qmFsgI0EiRWTFBMeXpUQThjZXRQZEh0bEd3MVg4S3Q3RWE0YmQyN0FwUjcaDGtnRURDTTBHOEFFQQ=="
          variants = [
            ("web-web", "https://www.youtube.com", web_key, "WEB", "2.20261030.02.00", web_token),
            ("music-music", "https://music.youtube.com", music_key, "WEB_REMIX", "1.20261031.09.00", music_token),
            ("web-music", "https://www.youtube.com", music_key, "WEB_REMIX", "1.20261031.09.00", music_token),
            ("music-web", "https://music.youtube.com", web_key, "WEB", "2.20261030.02.00", web_token),
            ("music-web-token", "https://music.youtube.com", web_key, "WEB", "2.20261030.02.00", web_token),
            ("web-music-token", "https://www.youtube.com", music_key, "WEB_REMIX", "1.20261031.09.00", music_token),
          ]
          def collect(x, out):
              if isinstance(x, dict):
                  if "lockupViewModel" in x:
                      l=x["lockupViewModel"]; md=l.get("metadata",{}).get("lockupMetadataViewModel",{})
                      out.append(("lockup", md.get("title",{}).get("content"), l.get("contentId") or l.get("videoId")))
                  if "playlistVideoRenderer" in x:
                      p=x["playlistVideoRenderer"]; out.append(("playlistVideo", p.get("title",{}).get("runs",[{}])[0].get("text"), p.get("videoId")))
                  if "musicResponsiveListItemRenderer" in x:
                      p=x["musicResponsiveListItemRenderer"]; title=None
                      for col in p.get("flexColumns",[]):
                          runs=col.get("musicResponsiveListItemFlexColumnRenderer",{}).get("text",{}).get("runs",[])
                          if runs: title=runs[0].get("text"); break
                      out.append(("music", title, p.get("playlistItemData",{}).get("videoId")))
                  for v in x.values(): collect(v,out)
              elif isinstance(x, list):
                  for v in x: collect(v,out)
          for name,base,key,client,version,token in variants:
              body={"context":{"client":{"hl":"en-GB","gl":"SG","clientName":client,"clientVersion":version,"userAgent":"Mozilla/5.0"}},"continuation":token}
              req=urllib.request.Request(base+"/youtubei/v1/browse?key="+key,data=json.dumps(body).encode(),headers={"Content-Type":"application/json","User-Agent":"Mozilla/5.0"})
              print("\n====", name, "====")
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw=r.read().decode(); status=r.status
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(); status=e.code
              except Exception as e:
                  print("EXCEPTION",repr(e)); continue
              print("STATUS",status,"LEN",len(raw))
              print(raw[:1500])
              try: data=json.loads(raw)
              except Exception: continue
              out=[]; collect(data,out)
              print("ITEMS",json.dumps(out,ensure_ascii=False))
              print("KEYS",list(data.keys()))
          PY
          python3 scrape.py
