name: scrape-yt
on:
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps
      - name: Inspect and load playlist DOM
        run: |
          cat > scrape.mjs <<'EOF'
          import { chromium } from 'playwright';
          const playlist='PLyzTA8cetPdHtlGw1X8Kt7Ea4bd27ApR7';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1400,height:1200},userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'});
          page.setDefaultTimeout(15000);
          await page.goto('https://www.youtube.com/playlist?list='+playlist+'&hl=en&gl=US',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(8000);
          for (const label of ['Accept all','I agree','Accept','Reject all','Dismiss']) {
            const btn=page.locator(`button:has-text("${label}"), tp-yt-paper-button:has-text("${label}")`).first();
            if (await btn.count()) await btn.click({timeout:1000}).catch(()=>{});
          }
          console.log('URL',page.url(),'TITLE',await page.title());
          console.log('FIRST_ROW_HTML', await page.locator('ytd-playlist-video-renderer').first().evaluate(e=>e.outerHTML.slice(0,5000)).catch(e=>String(e)));
          console.log('BUTTONS', await page.evaluate(()=>[...document.querySelectorAll('button, ytd-button-renderer, yt-button-shape, tp-yt-paper-button')].map(e=>({tag:e.tagName,id:e.id,text:(e.innerText||e.textContent||'').trim()})).filter(x=>x.text).slice(-30)));
          for(let i=0;i<15;i++){
            await page.evaluate(()=>{
              window.scrollTo(0,document.documentElement.scrollHeight);
              document.querySelectorAll('*').forEach(e=>{
                if(e.scrollHeight > e.clientHeight + 100) e.scrollTop = e.scrollHeight;
              });
              const c=document.querySelector('ytd-continuation-item-renderer');
              if(c) c.scrollIntoView({block:'end'});
            });
            await page.waitForTimeout(2500);
            const rows=await page.locator('ytd-playlist-video-renderer').count();
            const cont=await page.locator('ytd-continuation-item-renderer').count();
            console.log('LOOP',i,'ROWS',rows,'CONT',cont);
            if(rows>=52) break;
          }
          const items=await page.evaluate(()=>[...document.querySelectorAll('ytd-playlist-video-renderer')].map(row=>{
            const anchors=[...row.querySelectorAll('a[href*="/watch?v="]')];
            const titled=anchors.find(a=>(a.innerText||a.textContent||'').trim().length>3) || anchors[0];
            const title=(titled?.getAttribute('title')||titled?.innerText||titled?.textContent||'').trim();
            const href=titled?.href||'';
            return {title,id:new URL(href,location.href).searchParams.get('v'),href};
          }).filter(x=>x.id&&x.title));
          console.log('ITEMS',JSON.stringify(items,null,2));
          await page.screenshot({path:'final.png',fullPage:true});
          await browser.close();
          EOF
          node scrape.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspect-screenshot
          path: final.png
          if-no-files-found: warn
