name: scrape-yt
on:
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Query Invidious instances
        run: |
          cat > invidious.py <<'PY'
          import json, urllib.request, urllib.error
          pid='PLyzTA8cetPdHtlGw1X8Kt7Ea4bd27ApR7'
          hosts=['inv.nadeko.net','invidious.nerdvpn.de','yewtu.be','invidious.jing.rocks','invidious.f5.si','invidious.privacyredirect.com','yt.artemislena.eu','invidious.reallyaweso.me','iv.ggtyler.dev','invidious.lunar.icu','invidious.protokolla.fi','invidious.private.coffee','invidious.darkness.services']
          for h in hosts:
            url=f'https://{h}/api/v1/playlists/{pid}?fields=title,videoId,author,index,playlistThumbnail'
            print('\n===',h,'===')
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=15) as r:
                raw=r.read().decode(); print('STATUS',r.status,'LEN',len(raw)); print(raw[:5000])
                if len(raw)>1000:
                  open(h.replace('.','_')+'.json','w').write(raw)
            except Exception as e:
              print('ERR',repr(e))
          PY
          python3 invidious.py
