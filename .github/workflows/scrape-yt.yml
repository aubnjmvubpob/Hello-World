name: scrape-yt
on:
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Print final playlist items
        run: |
          python3 - <<'PY'
          import json, urllib.request
          pid='PLyzTA8cetPdHtlGw1X8Kt7Ea4bd27ApR7'
          url=f'https://inv.nadeko.net/api/v1/playlists/{pid}?fields=title,videoId,index,author,lengthSeconds'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          data=json.load(urllib.request.urlopen(req,timeout=30))
          print('COUNT',len(data['videos']))
          print(json.dumps(data['videos'][-5:],ensure_ascii=False,indent=2))
          PY
